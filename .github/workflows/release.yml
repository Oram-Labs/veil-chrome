name: Release

# Runs when a version tag is pushed, e.g. `git tag v0.1.1 && git push origin
# v0.1.1`. Builds the two zips (the -store one has no "key", for the Chrome Web
# Store), records a build attestation for each (which links it to this commit
# and workflow) and creates a GitHub release with them and their SHA-256. Nothing else is published: the site and the Chrome Web Store are
# updated separately.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches manifest.json
        run: |
          version=$(node -p 'require("./static/manifest.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but manifest.json says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm test
      - run: pnpm zip
      - name: Checksum
        run: |
          cd dist
          for zip in "veil-extension-$VERSION.zip" "veil-extension-$VERSION-store.zip"; do
            sha256sum "$zip" > "$zip.sha256"
            cat "$zip.sha256"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/veil-extension-${{ env.VERSION }}.zip
            dist/veil-extension-${{ env.VERSION }}-store.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/veil-extension-$VERSION.zip" "dist/veil-extension-$VERSION.zip.sha256" \
            "dist/veil-extension-$VERSION-store.zip" "dist/veil-extension-$VERSION-store.zip.sha256" \
            --title "veil-chrome $VERSION" \
            --notes "The -store zip is the one uploaded to the Chrome Web Store: the same files without \"key\" in manifest.json. Check either with \`pnpm verify <zip>\` at this tag, or with \`gh attestation verify <zip> --repo $GITHUB_REPOSITORY\`."
