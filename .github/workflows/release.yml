name: Release

# Runs when a version tag is pushed, e.g. `git tag v0.1.1 && git push origin
# v0.1.1`. Builds the zip, records a build attestation (which links the zip to
# this commit and workflow) and creates a GitHub release with the zip and its
# SHA-256. Nothing else is published: the site and the Chrome Web Store are
# updated separately.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches manifest.json
        run: |
          version=$(node -p 'require("./static/manifest.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but manifest.json says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm test
      - run: pnpm zip
      - name: Checksum
        run: |
          cd dist
          sha256sum "veil-extension-$VERSION.zip" > "veil-extension-$VERSION.zip.sha256"
          cat "veil-extension-$VERSION.zip.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/veil-extension-${{ env.VERSION }}.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/veil-extension-$VERSION.zip" "dist/veil-extension-$VERSION.zip.sha256" \
            --title "veil-chrome $VERSION" \
            --notes "Check it with \`pnpm verify veil-extension-$VERSION.zip\` at this tag, or with \`gh attestation verify veil-extension-$VERSION.zip --repo $GITHUB_REPOSITORY\`."
